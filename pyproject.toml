[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-explain"
version = "0.1.0"
description = "PostgreSQL query plan visualizer and performance diagnostics for the terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "psycopg2-binary>=2.9",
]

[project.scripts]
pg-explain = "pg_explain.cli:main"
